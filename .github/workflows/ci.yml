
name: CI-CD AfriShop

# Evenements declencheurs
on:
  push:
    branches: [main]
  workflow_dispatch:

# Autorisations de publication
permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # Premier job : verification et preparation
  verification:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Verifier les fichiers non vides
        run: |
          test -s site/index.html
          test -s site/style.css

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Preparer le site
        run: |
          mkdir -p public
          cp site/index.html site/style.css public/
          if [ -d site/images ]; then cp -r site/images public/; fi

      - name: Creer l artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Deuxieme job : deploiement
  deploiement:
    needs: verification
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deployer le site
        id: deployment
        uses: actions/deploy-pages@v4

